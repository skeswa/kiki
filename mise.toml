# Repo tooling is independent of the planned Rust application stack.
# Pin formatters exactly; update them deliberately and run `mise run fmt`.
[tools]
bun = "1.3.5"
jj = "0.46.0"
# The npm Oxfmt backend needs Node, but not this repo's node_modules.
node = "24.22.2"
"npm:oxfmt" = "0.64.0"
taplo = "0.10.0"

[tasks.setup]
description = "Install the locked documentation dependencies"
run = "bun install --frozen-lockfile"

[tasks."vcs:init"]
description = "Initialize colocated jj and apply repository-local VCS defaults"
run = '''
if [ ! -e .git ]; then
  echo "vcs:init requires an existing Git checkout" >&2
  exit 1
fi
if [ ! -d .jj ]; then
  jj git init --colocate
fi
jj config set --repo snapshot.max-new-file-size 16MiB
jj config set --repo 'revset-aliases."trunk()"' main@origin
jj bookmark track main@origin
'''

[tasks.fmt]
description = "Format handwritten TOML, code, and documentation"
run = ["taplo fmt", "oxfmt --write ."]

[tasks."fmt:check"]
description = "Check formatting without changing files"
run = ["taplo fmt --check", "oxfmt --check ."]

[tasks."docs:links"]
description = "Check reference and journal links, anchors, and contract terms"
run = "bun scripts/check-docs.ts"

[tasks.dev]
alias = "docs:dev"
description = "Serve the documentation site locally"
depends = ["setup"]
run = "bun node_modules/vitepress/bin/vitepress.js dev docs"

[tasks.build]
alias = "docs:build"
description = "Build the documentation site for production"
depends = ["setup"]
run = "bun node_modules/vitepress/bin/vitepress.js build docs"

[tasks.preview]
alias = "docs:preview"
description = "Preview the last documentation build"
depends = ["setup"]
run = "bun node_modules/vitepress/bin/vitepress.js preview docs"

[tasks."docs:check"]
description = "Validate documentation and build the site"
depends = ["docs:links", "build"]

[tasks.check]
description = "Run formatting, documentation, and production-build checks"
depends = ["fmt:check", "docs:check"]
